version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: local_postgres
    restart: always
    environment:
       POSTGRES_USER: ${POSTGRES_USER}
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
       POSTGRES_DB: ${POSTGRES_DB}
    ports:
       - "5432:5432"
    volumes:
       - postgres_data:/var/lib/postgresql
    networks:
       - app_network

  redis:
    image: redis:7-alpine
    container_name: local_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  redpanda:
    image: docker.io/redpandadata/redpanda:v23.3.5
    container_name: local_redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost19092
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: local_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/urs/share/prometheus/console'
    ports:
      - '9090:9090'
    networks:
      - app_network
    depends_on:
      - redpanda

networks:
  app_network: 
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  redpanda_data:
    driver: local
  prometheus_data:
    driver: local